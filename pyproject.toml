[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cpss-corpus"
version = "0.1.0"
description = "Reproducible Codeforces corpus ingestion, MongoDB storage and export"
requires-python = ">=3.11"
dependencies = [
  "pymongo>=4.11,<5", "httpx>=0.28,<0.29", "beautifulsoup4>=4.13,<5",
  "jsonschema>=4.23,<5", "python-dotenv>=1,<2",
  "pyarrow>=19,<25", "fsspec>=2025.3", "aiohttp>=3.11,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cpss = "cpss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mongo: real disposable MongoDB integration tests"]

